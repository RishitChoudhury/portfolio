<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&amp;family=Share+Tech+Mono&amp;display=swap');
      
      .bg { fill: #0a0a0a; }
      .text-syn { font-family: 'Oswald', sans-serif; font-size: 58px; font-weight: 700; fill: #FFFFFF; letter-spacing: 1px; }
      .text-taxt { font-family: 'Oswald', sans-serif; font-size: 58px; font-weight: 700; fill: #FF003C; letter-spacing: 1px; }
      .icon-bracket { font-family: 'Share Tech Mono', monospace; font-size: 64px; fill: #FF003C; font-weight: bold; }
      .accent { fill: #FF003C; }
      .grid-line { stroke: #222222; stroke-width: 1; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="4"/>
  
  <line x1="0" y1="20" x2="500" y2="20" class="grid-line" />
  <line x1="0" y1="100" x2="500" y2="100" class="grid-line" />
  <line x1="100" y1="0" x2="100" y2="120" class="grid-line" />

  <text x="35" y="82" class="icon-bracket">&lt;</text>
  <path d="M 75 35 L 90 85 L 102 85 L 87 35 Z" fill="#FFFFFF"/>
  <text x="105" y="82" class="icon-bracket">&gt;</text>

  <text x="160" y="80" class="text-syn">SYN</text>
  <text x="260" y="80" class="text-taxt">TAXT</text>

  <rect x="160" y="92" width="30" height="4" class="accent"/>
  <rect x="195" y="92" width="6" height="4" fill="#444"/>
  <rect x="205" y="92" width="6" height="4" fill="#444"/>
  
  <path d="M 470 25 L 480 25 L 480 35" fill="none" stroke="#FF003C" stroke-width="2"/>
  <path d="M 480 85 L 480 95 L 470 95" fill="none" stroke="#FF003C" stroke-width="2"/>
</svg>
